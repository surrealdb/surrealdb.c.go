name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Keep in sync with SURREALDB_C_V3_REF in test.yml.
  SURREALDB_C_V3_REF: 039481e0c46fcd9c4096a9eaf85ec3a8fadf80ec

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26"

      - uses: dtolnay/rust-toolchain@stable

      - name: Run golangci-lint
        env:
          SURREALDB_C_REF: ${{ env.SURREALDB_C_V3_REF }}
        run: make lint
