name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Linux: full matrix with Docker (embedded + remote via go/cgo drivers)
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        surrealdb-version: [v2, v3.0.1]
        remote-driver: [go, cgo]
        include:
          # cgo + v3 needs surrealdb.c built from the v3-compatible branch
          - surrealdb-version: v3.0.1
            remote-driver: cgo
            surrealdb-c-ref: surrealdb-v3-support
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - uses: dtolnay/rust-toolchain@stable

      - name: Pull SurrealDB Docker image
        run: docker pull surrealdb/surrealdb:${{ matrix.surrealdb-version }}

      - name: Run tests
        env:
          SURREALDB_IMAGE_TAG: ${{ matrix.surrealdb-version }}
          SURREALDB_REMOTE_DRIVER: ${{ matrix.remote-driver }}
          SURREALDB_C_FEATURES: ${{ matrix.remote-driver == 'cgo' && 'protocol-ws' || '' }}
          SURREALDB_C_REF: ${{ matrix.surrealdb-c-ref || 'main' }}
        run: make test

  # macOS: embedded CGo tests only (no Docker)
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - uses: dtolnay/rust-toolchain@stable

      - name: Run embedded tests
        env:
          SURREALDB_SKIP_DOCKER: "1"
        run: make test
