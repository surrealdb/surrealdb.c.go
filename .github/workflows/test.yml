name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Last surrealdb.c commit compatible with SurrealDB v2.
  SURREALDB_C_V2_REF: 1625b5ce1694efd4056cca453dbcd03682497d8e
  # The surrealdb.c branch that supports Rust 1.94+
  SURREALDB_C_V3_REF: rust-1.94

jobs:
  # Linux: full matrix with Docker (embedded + remote via go/cgo drivers)
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        surrealdb-version: [v2, v3.0.1]
        remote-driver: [go, cgo]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.surrealdb-version == 'v2' && '1.93.1' || 'stable' }}

      - name: Pull SurrealDB Docker image
        run: docker pull surrealdb/surrealdb:${{ matrix.surrealdb-version }}

      - name: Run tests
        env:
          SURREALDB_IMAGE_TAG: ${{ matrix.surrealdb-version }}
          SURREALDB_REMOTE_DRIVER: ${{ matrix.remote-driver }}
          SURREALDB_C_FEATURES: ${{ matrix.remote-driver == 'cgo' && 'protocol-ws' || '' }}
          SURREALDB_C_REF: ${{ matrix.surrealdb-version == 'v2' && env.SURREALDB_C_V2_REF || env.SURREALDB_C_V3_REF }}
        run: make test

  # macOS: embedded CGo tests only (no Docker).
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - uses: dtolnay/rust-toolchain@stable

      - name: Run embedded tests
        env:
          SURREALDB_SKIP_DOCKER: "1"
          SURREALDB_C_REF: ${{ env.SURREALDB_C_V3_REF }}
        run: make test
