name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        surrealdb-version: [v2, v3.0.1]
        remote-driver: [go, cgo]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - uses: dtolnay/rust-toolchain@stable

      - name: Pull SurrealDB Docker image
        run: docker pull surrealdb/surrealdb:${{ matrix.surrealdb-version }}

      - name: Run tests
        env:
          SURREALDB_IMAGE_TAG: ${{ matrix.surrealdb-version }}
          SURREALDB_REMOTE_DRIVER: ${{ matrix.remote-driver }}
          SURREALDB_C_FEATURES: ${{ matrix.remote-driver == 'cgo' && 'protocol-ws' || '' }}
        run: make test
